---
- name: Install dependencies
  apt:
    name:
      - wget
      - gpg
    state: present
    update_cache: true

- name: Download Grafana key
  get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana.key

- name: Add keyring
  shell: |
    cat /tmp/grafana.key | gpg --dearmor > /usr/share/keyrings/grafana.gpg
  args:
    creates: /usr/share/keyrings/grafana.gpg

- name: Add Grafana repository
  copy:
    dest: /etc/apt/sources.list.d/grafana.list
    content: |
      deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main

- name: Apt update
  apt:
    update_cache: true

- name: Install Grafana
  apt:
    name: grafana
    state: present

- name: Enable Grafana
  systemd:
    name: grafana-server
    enabled: true
    state: started